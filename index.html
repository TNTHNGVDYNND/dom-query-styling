<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Learn DOM manipulation and styling with vanilla JavaScript. Build interactive menus using CSS classes, method chaining, OOP patterns, ES6 modules, and animations—no frameworks.">
    <meta name="keywords"
        content="DOM, JavaScript, CSS, styling, OOP, ES6 modules, vanilla JavaScript, method chaining, web development, learning">
    <meta name="author" content="TNTHNGVDYNND">
    <meta property="og:title" content="DOM Query Styling - Learn JavaScript DOM Manipulation">
    <meta property="og:description"
        content="Build interactive menus with vanilla JavaScript: DOM manipulation, CSS classes, OOP patterns, animations, and responsive design.">
    <meta property="og:type" content="website">
    <title>DOM Query Styling - Learn JavaScript DOM Manipulation</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <header>
        <h1 class="title">Delicious Carb Indulgence</h1>
    </header>

    <main id="main-content" class="main" role="main">
        <section aria-labelledby="starters-heading">
            <h2 id="starters-heading" class="category">Starters</h2>
            <ul class="menu-category" role="list">
                <li class="food-item" role="listitem">Item-1</li>
                <li class="food-item" role="listitem">Item-2</li>
                <li class="food-item" role="listitem">Item-3</li>
            </ul>
        </section>
        <section aria-labelledby="mains-heading">
            <h2 id="mains-heading" class="category">Main-Menu</h2>
            <ul class="menu-category" role="list">
                <li class="food-item" role="listitem">Item-1</li>
                <li class="food-item" role="listitem">Item-2</li>
                <li class="food-item" role="listitem">Item-3</li>
            </ul>
        </section>
        <section aria-labelledby="desserts-heading">
            <h2 id="desserts-heading" class="category">Desserts</h2>
            <ul class="menu-category" role="list">
                <li class="food-item" role="listitem">Item-1</li>
                <li class="food-item" role="listitem">Item-2</li>
                <li class="food-item" role="listitem">Item-3</li>
            </ul>
        </section>
    </main>

    <footer role="contentinfo">
        <label for="search-input" class="visually-hidden">Search menu items</label>
        <input type="search" id="search-input" class="guess" placeholder="Search menu items..."
            aria-label="Search menu items" aria-describedby="search-help" />
        <span id="search-help" class="visually-hidden">Type to filter menu items in real-time</span>
        <button class="btn-check" aria-label="Display your entered number">Click me</button>
    </footer>

    <script type="module" src="src/main.js"></script>

</body>

</html>
